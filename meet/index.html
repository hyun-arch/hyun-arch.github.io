<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1830">
<meta name="robots" content="noindex,nofollow">
<title>아람 회의록 — 말로 하는 미팅, 자동 정리·공유</title>
<style>
  :root{--bg:#0e1220;--panel:#161c2e;--panel2:#1e263b;--line:#2a3350;--tx:#e8ecf6;--dim:#93a0bd;--dim2:#5f6c8a;--acc:#4f8cff;--acc2:#7aa7ff;--g:#2fbf71;--r:#ff6b6b;--y:#ffcf5c;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea{font-family:inherit;}
  .wrap{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{position:sticky;top:0;z-index:20;background:rgba(14,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.3px;}
  .logo span{color:var(--acc2);}
  .logo small{display:block;font-size:10px;color:var(--dim2);font-weight:500;letter-spacing:0;}
  .grow{flex:1;}
  .btn{background:var(--acc);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;}
  .btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line);}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
  .btn.red{background:var(--r);} .btn.g{background:var(--g);}
  .btn:active{transform:translateY(1px);}
  main{flex:1;padding:16px;}
  .empty{text-align:center;color:var(--dim);padding:60px 20px;}
  .empty .big{font-size:44px;margin-bottom:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.15s;}
  .card:hover{border-color:var(--acc);}
  .card h3{font-size:16px;margin-bottom:4px;}
  .card .meta{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .card .prev{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--dim);}
  .tag{display:inline-block;background:rgba(79,140,255,.15);color:var(--acc2);border-radius:6px;padding:1px 7px;font-size:11px;margin:1px;}
  /* overlay/detail */
  .sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;}
  .sheet.on{display:flex;}
  .sheet .top{position:sticky;top:0;background:rgba(14,18,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .sheet .body{flex:1;overflow:auto;padding:16px;max-width:920px;margin:0 auto;width:100%;}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px;font-weight:600;}
  .in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--tx);font-size:15px;}
  textarea.in{min-height:120px;resize:vertical;line-height:1.6;}
  .rec-bar{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--dim2);}
  .dot.live{background:var(--r);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .transcript{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:140px;font-size:15px;line-height:1.7;white-space:pre-wrap;}
  .transcript .interim{color:var(--dim);}
  h2.sec{font-size:13px;color:var(--acc2);margin:18px 0 8px;text-transform:none;font-weight:800;letter-spacing:.3px;}
  .sumbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .sumbox ul{margin-left:18px;} .sumbox li{margin:4px 0;}
  .todo{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:5px 0;font-size:14px;}
  .todo b{color:var(--y);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .muted{color:var(--dim);font-size:12.5px;}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;}
  .modal.on{display:flex;}
  .modal .mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:440px;width:100%;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:10px;z-index:100;opacity:0;transition:.25s;font-size:14px;}
  .toast.on{opacity:1;}
  .warn{background:rgba(255,207,92,.12);border:1px solid rgba(255,207,92,.35);color:var(--y);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0;}
  a{color:var(--acc2);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">아람 <span>회의록</span><small>말로 하면, 자동으로 정리·공유</small></div>
    <div class="grow"></div>
    <button class="btn ghost sm" onclick="openSettings()">⚙</button>
    <button class="btn" onclick="newMeeting()">＋ 새 미팅</button>
  </header>
  <main id="list"></main>
</div>

<!-- 편집/녹음 시트 -->
<div class="sheet" id="editSheet">
  <div class="top">
    <button class="btn ghost sm" onclick="closeEdit()">← 뒤로</button>
    <div class="logo" style="font-size:15px">새 미팅</div>
    <div class="grow"></div>
    <button class="btn g sm" onclick="saveMeeting()">저장</button>
  </div>
  <div class="body">
    <label>미팅 제목</label>
    <input class="in" id="mTitle" placeholder="예: 7월 주간 경영회의">
    <div class="row">
      <div style="flex:1;min-width:180px"><label>날짜</label><input class="in" id="mDate" type="date"></div>
      <div style="flex:2;min-width:200px"><label>참석자 (쉼표로 구분)</label><input class="in" id="mPart" placeholder="김태원, 홍종혁, 성무신"></div>
    </div>
    <label>🎤 실시간 받아쓰기 <span class="muted" id="sttSupport"></span></label>
    <div class="rec-bar">
      <span class="dot" id="recDot"></span>
      <button class="btn red sm" id="recBtn" onclick="toggleRec()">녹음 시작</button>
      <span class="muted" id="recHint">버튼을 누르고 말하면 글로 받아써져요. (크롬 권장)</span>
    </div>
    <div class="transcript" id="mText" contenteditable="true" spellcheck="false" placeholder="여기에 회의 내용이 받아써지거나, 직접 붙여넣어도 됩니다."></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm" onclick="autoSummarize()">🧠 자동 요약 만들기</button>
      <button class="btn ghost sm" onclick="aiSummarize()" id="aiBtn">✨ AI 요약 (키 필요)</button>
    </div>
    <div id="sumPreview"></div>
  </div>
</div>

<!-- 상세 보기 시트 -->
<div class="sheet" id="viewSheet">
  <div class="top">
    <button class="btn ghost sm" onclick="closeView()">← 목록</button>
    <div class="logo" style="font-size:15px" id="vTitleTop">미팅</div>
    <div class="grow"></div>
    <button class="btn ghost sm" onclick="editCurrent()">수정</button>
    <button class="btn ghost sm" onclick="shareCurrent()">공유</button>
    <button class="btn ghost sm red" onclick="deleteCurrent()">삭제</button>
  </div>
  <div class="body" id="vBody"></div>
</div>

<!-- 설정 모달 -->
<div class="modal" id="setModal">
  <div class="mbox">
    <div class="logo" style="font-size:16px;margin-bottom:6px">설정</div>
    <div class="warn">AI 요약은 <b>본인 API 키</b>가 있을 때만 작동합니다. 키는 이 브라우저에만 저장되고 서버로 안 보냅니다. 없으면 '자동 요약'(무료·기기내)만 씁니다.</div>
    <label>Anthropic Claude API 키 (선택)</label>
    <input class="in" id="apiKey" type="password" placeholder="sk-ant-...">
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn ghost sm" onclick="closeSettings()">닫기</button>
      <button class="btn sm" onclick="saveSettings()">저장</button>
    </div>
    <p class="muted" style="margin-top:12px">아람 회의록 v1 · 아람휴비스 사내용 · 데이터는 이 기기(브라우저)에 저장됩니다.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS='aram.meetings.v1', LK='aram.apikey.v1';
let meetings = load(), curId=null, editId=null, rec=null, recording=false, finalText='';

function load(){ try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]} }
function save(){ localStorage.setItem(LS, JSON.stringify(meetings)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtDate(d){ if(!d) return ''; const x=new Date(d); return isNaN(x)? d : `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`; }

/* ---------- 목록 ---------- */
function renderList(){
  const el=document.getElementById('list');
  if(!meetings.length){ el.innerHTML=`<div class="empty"><div class="big">🎙️</div><b>아직 정리된 미팅이 없어요.</b><br><span class="muted">＋ 새 미팅을 눌러 말로 하면, 자동으로 글로 정리돼요.</span></div>`; return; }
  const sorted=[...meetings].sort((a,b)=>(b.date||'').localeCompare(a.date||'')|| b.createdAt-a.createdAt);
  el.innerHTML=sorted.map(m=>`
    <div class="card" onclick="openView('${m.id}')">
      <h3>${esc(m.title||'제목 없음')}</h3>
      <div class="meta"><span>📅 ${fmtDate(m.date)||'날짜 미정'}</span>${(m.participants||[]).map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div>
      <div class="prev">${esc((m.summary&&m.summary.brief)|| (m.transcript||'').slice(0,120) || '내용 없음')}</div>
    </div>`).join('');
}

/* ---------- 새 미팅 / 편집 ---------- */
function newMeeting(){ editId=null; document.getElementById('mTitle').value=''; document.getElementById('mDate').value=new Date().toISOString().slice(0,10); document.getElementById('mPart').value=''; document.getElementById('mText').innerText=''; document.getElementById('sumPreview').innerHTML=''; finalText=''; document.querySelector('#editSheet .logo').textContent='새 미팅'; document.getElementById('editSheet').classList.add('on'); }
function editCurrent(){ const m=meetings.find(x=>x.id===curId); if(!m)return; editId=m.id; document.getElementById('mTitle').value=m.title||''; document.getElementById('mDate').value=m.date||''; document.getElementById('mPart').value=(m.participants||[]).join(', '); document.getElementById('mText').innerText=m.transcript||''; finalText=m.transcript||''; document.getElementById('sumPreview').innerHTML=''; document.querySelector('#editSheet .logo').textContent='미팅 수정'; closeView(); document.getElementById('editSheet').classList.add('on'); }
function closeEdit(){ if(recording) toggleRec(); document.getElementById('editSheet').classList.remove('on'); }

function saveMeeting(){
  const title=document.getElementById('mTitle').value.trim();
  const transcript=document.getElementById('mText').innerText.trim();
  if(!title && !transcript){ toast('제목이나 내용을 넣어주세요'); return; }
  const parts=document.getElementById('mPart').value.split(',').map(s=>s.trim()).filter(Boolean);
  const summary=buildSummary(transcript);
  if(editId){ const m=meetings.find(x=>x.id===editId); Object.assign(m,{title,date:document.getElementById('mDate').value,participants:parts,transcript,summary}); }
  else{ meetings.push({id:uid(),title,date:document.getElementById('mDate').value,participants:parts,transcript,summary,createdAt:Date.now()}); }
  save(); closeEdit(); renderList(); toast('저장됐어요');
}

/* ---------- 음성 받아쓰기 (Web Speech API) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){ document.getElementById('sttSupport').textContent='(이 브라우저는 음성인식 미지원 — 직접 입력 가능)'; document.getElementById('recBtn').disabled=true; document.getElementById('recBtn').style.opacity=.5; }
else{ document.getElementById('sttSupport').textContent=''; }
function toggleRec(){
  if(!SR) return;
  if(recording){ rec.stop(); return; }
  rec=new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=true;
  finalText=document.getElementById('mText').innerText;
  rec.onresult=(e)=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal){ finalText += (finalText&&!finalText.endsWith('\n')?' ':'') + t.trim(); } else interim+=t; } const box=document.getElementById('mText'); box.innerHTML=esc(finalText)+(interim?` <span class="interim">${esc(interim)}</span>`:''); box.scrollTop=box.scrollHeight; };
  rec.onerror=(e)=>{ toast('음성인식 오류: '+e.error); };
  rec.onend=()=>{ recording=false; document.getElementById('recDot').classList.remove('live'); document.getElementById('recBtn').textContent='녹음 시작'; document.getElementById('mText').innerText=finalText; };
  rec.start(); recording=true; document.getElementById('recDot').classList.add('live'); document.getElementById('recBtn').textContent='■ 정지'; document.getElementById('recHint').textContent='듣고 있어요… 말씀하세요.';
}

/* ---------- 자동 요약 (기기내 휴리스틱) ---------- */
function splitSentences(t){ return (t||'').replace(/\n+/g,' ').split(/(?<=[.!?。])\s+|(?<=요)\s+|(?<=다)\s+/).map(s=>s.trim()).filter(s=>s.length>4); }
function buildSummary(t){
  if(!t) return {brief:'',points:[],decisions:[],todos:[]};
  const sents=splitSentences(t);
  const decKw=/(결정|합의|하기로|확정|승인|채택|정했|가기로|진행하기로)/;
  const todoKw=/(하기로|해야|예정|준비|진행|처리|검토|공유|작성|발송|확인|요청|팔로우업|담당|맡)/;
  const dateKw=/(오늘|내일|모레|이번주|다음주|월요일|화요일|수요일|목요일|금요일|\d{1,2}월|\d{1,2}일|\d{1,2}시|까지|월말|분기|주중|차주)/;
  const decisions=[], todos=[];
  sents.forEach(s=>{
    if(decKw.test(s)) decisions.push(s);
    else if(todoKw.test(s)){ const due=(s.match(dateKw)||[])[0]||''; const who=(s.match(/([가-힣]{2,4})(님|씨|부장|과장|대리|사원|이사|팀장|실장|매니저)?\s?(가|이|은|는|께서)?\s?(맡|담당|하기로|준비|처리)/)||[])[1]||''; todos.push({t:s,due,who}); }
  });
  // 핵심 3~5문장: 결정/할일 아닌 것 중 길이·키워드 가중
  const kw=/(매출|계약|납품|수주|고객|이슈|리스크|문제|개발|일정|예산|비용|출시|배포|파트너|해외|가격|목표)/;
  const points=sents.filter(s=>!decKw.test(s)).map(s=>({s,score:(kw.test(s)?2:0)+Math.min(s.length/40,2)})).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.s);
  const brief = (points[0]||sents[0]||'').slice(0,140);
  return {brief,points,decisions:decisions.slice(0,8),todos:todos.slice(0,10)};
}
function autoSummarize(){
  const t=document.getElementById('mText').innerText.trim();
  if(!t){ toast('먼저 내용을 넣어주세요'); return; }
  renderSumPreview(buildSummary(t));
  toast('자동 요약 완료 (저장하면 반영돼요)');
}
function renderSumPreview(s){
  document.getElementById('sumPreview').innerHTML = summaryHTML(s);
}
function summaryHTML(s){
  if(!s) return '';
  let h='<h2 class="sec">📌 핵심 요약</h2><div class="sumbox"><ul>'+(s.points.length?s.points.map(p=>`<li>${esc(p)}</li>`).join(''):'<li class="muted">추출된 핵심 없음</li>')+'</ul></div>';
  h+='<h2 class="sec">✅ 결정 사항</h2><div class="sumbox">'+(s.decisions.length?('<ul>'+s.decisions.map(d=>`<li>${esc(d)}</li>`).join('')+'</ul>'):'<span class="muted">감지된 결정 없음</span>')+'</div>';
  h+='<h2 class="sec">📝 할 일 (액션 아이템)</h2><div class="sumbox">'+(s.todos.length?s.todos.map(t=>`<div class="todo"><span>▫</span><span>${esc(t.t)} ${t.who?`<b>[${esc(t.who)}]</b>`:''} ${t.due?`<span class="tag">${esc(t.due)}</span>`:''}</span></div>`).join(''):'<span class="muted">감지된 할 일 없음</span>')+'</div>';
  return h;
}

/* ---------- AI 요약 (선택, 본인 키) ---------- */
async function aiSummarize(){
  const key=localStorage.getItem(LK);
  if(!key){ toast('설정(⚙)에서 API 키를 먼저 넣어주세요'); openSettings(); return; }
  const t=document.getElementById('mText').innerText.trim();
  if(!t){ toast('먼저 내용을 넣어주세요'); return; }
  document.getElementById('aiBtn').textContent='✨ AI 요약 중…';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-3-5-haiku-20241022',max_tokens:1200,messages:[{role:'user',content:`아래 회의 받아쓰기를 한국어로 정리해줘. JSON만 출력: {"brief":"한줄요약","points":["핵심3~5"],"decisions":["결정사항"],"todos":[{"t":"할일","who":"담당","due":"기한"}]}\n\n---\n${t}`}]})});
    const j=await r.json();
    if(j.error) throw new Error(j.error.message||'API 오류');
    let txt=(j.content&&j.content[0]&&j.content[0].text)||'';
    const m=txt.match(/\{[\s\S]*\}/); const s=JSON.parse(m?m[0]:txt);
    renderSumPreview(s); window._aiSum=s; toast('AI 요약 완료');
  }catch(e){ toast('AI 요약 실패: '+e.message); }
  document.getElementById('aiBtn').textContent='✨ AI 요약 (키 필요)';
}

/* ---------- 상세 보기 ---------- */
function openView(id){ curId=id; const m=meetings.find(x=>x.id===id); if(!m)return; document.getElementById('vTitleTop').textContent=m.title||'미팅';
  const s=m.summary||buildSummary(m.transcript);
  document.getElementById('vBody').innerHTML=`
    <h2 style="font-size:22px;margin-bottom:6px">${esc(m.title||'제목 없음')}</h2>
    <div class="meta" style="margin-bottom:14px;color:var(--dim);font-size:13px">📅 ${fmtDate(m.date)||'날짜 미정'} &nbsp; 👥 ${(m.participants||[]).map(esc).join(', ')||'참석자 미정'}</div>
    ${summaryHTML(s)}
    <h2 class="sec">🎙️ 전체 받아쓰기</h2>
    <div class="sumbox" style="white-space:pre-wrap;line-height:1.75;color:var(--dim)">${esc(m.transcript||'내용 없음')}</div>`;
  closeView(); document.getElementById('viewSheet').classList.add('on'); }
function closeView(){ document.getElementById('viewSheet').classList.remove('on'); renderList(); }
function deleteCurrent(){ if(!confirm('이 미팅을 삭제할까요?'))return; meetings=meetings.filter(x=>x.id!==curId); save(); closeView(); renderList(); toast('삭제됐어요'); }

/* ---------- 공유 ---------- */
function plainText(m){ const s=m.summary||buildSummary(m.transcript); let o=`📋 ${m.title||'미팅'}\n📅 ${fmtDate(m.date)} · 👥 ${(m.participants||[]).join(', ')}\n\n[핵심 요약]\n${s.points.map(p=>'• '+p).join('\n')||'-'}\n\n[결정 사항]\n${s.decisions.map(d=>'✔ '+d).join('\n')||'-'}\n\n[할 일]\n${s.todos.map(t=>`▫ ${t.t}${t.who?' ['+t.who+']':''}${t.due?' ('+t.due+')':''}`).join('\n')||'-'}\n\n[전체 내용]\n${m.transcript||''}\n\n— 아람 회의록`; return o; }
async function shareCurrent(){ const m=meetings.find(x=>x.id===curId); if(!m)return; const txt=plainText(m);
  if(navigator.share){ try{ await navigator.share({title:m.title,text:txt}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(txt); toast('클립보드에 복사됐어요 — 붙여넣기 공유'); }
  catch(e){ downloadTxt(m.title+'.txt',txt); }
}
function downloadTxt(name,txt){ const b=new Blob([txt],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }

/* ---------- 설정 ---------- */
function openSettings(){ document.getElementById('apiKey').value=localStorage.getItem(LK)||''; document.getElementById('setModal').classList.add('on'); }
function closeSettings(){ document.getElementById('setModal').classList.remove('on'); }
function saveSettings(){ const k=document.getElementById('apiKey').value.trim(); if(k) localStorage.setItem(LK,k); else localStorage.removeItem(LK); closeSettings(); toast('저장됐어요'); }

renderList();
</script>
</body>
</html>
